# JVM args for the Gradle daemon.
#
# NOTE on -Djdk.net.unixdomain.tmpdir: on this machine, Windows AF_UNIX connect() fails with
# "Invalid argument" when the socket file path contains a space. The default socket dir is
# java.io.tmpdir (C:\Users\Gaming Krew\AppData\Local\Temp), which does. The JDK uses an AF_UNIX
# socketpair for the NIO Pipe backing every Selector, so Selector.open() throws
# "Unable to establish loopback connection" and no Gradle/Kotlin daemon can start at all.
# Pointing the Unix-socket temp dir at a space-free path fixes it. Keep this on any JVM Gradle
# forks (daemon, Kotlin compile daemon, test workers).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:\\Projects\\.jvmtmp
kotlin.daemon.jvmargs=-Xmx2048m -Djdk.net.unixdomain.tmpdir=C:\\Projects\\.jvmtmp

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
